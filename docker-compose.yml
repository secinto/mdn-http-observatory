services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatory}
      POSTGRES_DB: ${POSTGRES_DB:-observatory}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-observatory}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - observatory-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  observatory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        RUN_ID: ${RUN_ID:-local}
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /home/node/app/node_modules/node_extra_ca_certs_mozilla_bundle/ca_bundle/ca_intermediate_root_bundle.pem
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-observatory}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-observatory}
      PGPORT: 5432
      HTTPOBS_BASE_URL: ${HTTPOBS_BASE_URL:-http://localhost:${OBSERVATORY_PORT:-3001}}
      ABORT_TIMEOUT: ${ABORT_TIMEOUT:-30000}
      CLIENT_TIMEOUT: ${CLIENT_TIMEOUT:-25000}
      HTTPOBS_API_PORT: 8080
    ports:
      - "${OBSERVATORY_BIND_HOST:-0.0.0.0}:${OBSERVATORY_PORT:-3001}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - observatory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  observatory-network:
    driver: bridge
